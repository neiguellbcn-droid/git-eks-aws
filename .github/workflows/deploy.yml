name: "EKS Infrastructure"

env:
  AWS_REGION: "eu-west-1"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar (apply o destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform EKS"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
 

      - name: Autenticar en AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

